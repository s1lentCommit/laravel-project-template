services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    working_dir: /var/www

    env_file:
      - ./backend/.env.prod

    environment:
      APP_DIR: /var/www

    volumes:
      - ./backend/.env.prod:/var/www/.env
      - public_data:/var/www/public
      - storage_data:/var/www/storage/app/public

    depends_on:
      db:
        condition: service_healthy

    command: /entrypoint.sh

    networks:
      - laravel

    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    environment:
      APP_ROOT: /var/www

    # Publish container port 80 to localhost:8040 on the server
    ports:
      - '127.0.0.1:8040:80'

    # Give nginx access to project files Prefer container
    volumes:
      - public_data:/var/www/public:ro
      - storage_data:/var/www/storage/app/public:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

    depends_on:
      - app

    networks:
      - laravel

    restart: unless-stopped

  db:
    image: mysql:8.0

    # Load MySQL credentials from .env file
    env_file:
      - ./backend/.env.prod

    volumes:
      - dbdata:/var/lib/mysql

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - laravel

    restart: unless-stopped

# Used for persistent MySQL data, managed by Docker
volumes:
  dbdata:
  public_data:
  storage_data:

# Internal Docker network for container communication
networks:
  laravel:
